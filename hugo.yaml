baseURL: https://lian0-0mochi.github.io/
languageCode: en-us
title: Lian Wang
theme: PaperMod

pagination:
  pagerSize: 5

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: Lian Wang
  description: Personal website of Lian Wang - PhD Student in Biology at Duke University
  keywords:
    - biology
    - research
    - Duke University
    - Lian Wang
    - Lianzijun Wang
  author: Lian Wang
  # images:
  #   - /profile.jpg
  DateFormat: January 2, 2006
  defaultTheme: auto  # dark, light, auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    # disableHLJS: true  # to disable highlight.js
    # disableFingerprinting: true
    # favicon: /favicon.ico
    # favicon16x16: /favicon-16x16.png
    # favicon32x32: /favicon-32x32.png
    # apple_touch_icon: /apple-touch-icon.png
    # safari_pinned_tab: /safari-pinned-tab.svg

  label:
    text: Lian Wang
    icon: ""
    iconHeight: 35

  # Main sections to show on home page
  mainSections:
    - publications

  profileMode:
    enabled: false
    title: Lian Wang
    subtitle: PhD Student in Biology | Duke University
    # imageUrl: /profile.jpg
    # imageWidth: 120
    # imageHeight: 120
    # imageTitle: Lian Wang
    buttons:
      - name: Publications
        url: /publications
      - name: Posts
        url: /posts
      - name: Tags
        url: /tags
      - name: Archive
        url: /archives
      - name: About
        url: /about
      - name: Search
        url: /search

  homeInfoParams:
    Title: "Lian Wang"
    Content: "PhD Student in Biology | Duke University"

  socialIcons:
    - name: github
      url: https://github.com/lian0-0mochi
    - name: googlescholar
      url: https://scholar.google.com/citations?user=jBOe1ocAAAAJ&hl=en
    - name: researchgate
      url: https://www.researchgate.net/profile/Lianzijun-Wang
    - name: orcid
      url: https://orcid.org/0000-0001-6467-4387
    - name: email
      url: mailto:your.email@example.com

  analytics:
    google:
      # SiteVerificationTag: XYZabc
    bing:
      # SiteVerificationTag: XYZabc
    yandex:
      # SiteVerificationTag: XYZabc

  cover:
    hidden: false  # show cover images in structured data and pages
    hiddenInList: false  # show on list pages and home
    hiddenInSingle: false  # show on single page

  editPost:
    # URL: https://github.com/lian0-0mochi/lian0-0mochi.github.io/tree/master/content
    # Text: Suggest Changes  # edit text
    # appendFilePath: true  # to append file path to Edit link

# For search
# https://github.com/adityatelange/hugo-PaperMod/wiki/Features#search-page
outputs:
  home:
    - HTML
    - RSS
    - JSON  # necessary for search

# Syntax highlighting
markup:
  highlight:
    anchorLineNos: false
    codeFences: true
    guessSyntax: false
    hl_Lines: ""
    hl_inline: false
    lineAnchors: ""
    lineNoStart: 1
    lineNos: false
    lineNumbersInTable: true
    noClasses: false
    noHl: false
    style: monokai
    tabWidth: 4

# Menu configuration
menu:
  main:
    - identifier: publications
      name: Publications
      url: /publications/
      weight: 5
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 30
    - identifier: about
      name: About
      url: /about/
      weight: 40
    - identifier: search
      name: Search
      url: /search/
      weight: 50

# Taxonomies
taxonomies:
  category: categories
  tag: tags
  series: series
